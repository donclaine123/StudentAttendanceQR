<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EazyAttend</title>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Auth Stylesheet -->
  <link rel="stylesheet" href="../css/login.css">
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Clean Back to Home Navigation Button -->
  <a href="../index.html" class="home-button">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <rect x="5" y="5" width="90" height="90" rx="25" ry="25" fill="#4f46e5"/>
      <rect x="25" y="25" width="20" height="20" rx="4" ry="4" fill="white"/>
      <rect x="55" y="25" width="20" height="20" rx="4" ry="4" fill="white"/>
      <rect x="25" y="55" width="20" height="20" rx="4" ry="4" fill="white"/>
      <rect x="55" y="55" width="20" height="20" rx="4" ry="4" fill="white"/>
    </svg>
    <span>EazyAttend</span>
  </a>

  <div class="auth-container">
    <div class="auth-header">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="32" height="32" style="vertical-align: middle;">
        <rect x="5" y="5" width="90" height="90" rx="25" ry="25" fill="#4f46e5"/>
        <rect x="25" y="25" width="20" height="20" rx="4" ry="4" fill="white"/>
        <rect x="55" y="25" width="20" height="20" rx="4" ry="4" fill="white"/>
        <rect x="25" y="55" width="20" height="20" rx="4" ry="4" fill="white"/>
        <rect x="55" y="55" width="20" height="20" rx="4" ry="4" fill="white"/>
      </svg>
      <span class="logo-text-header">EazyAttend</span>
    </div>

    <div class="login-box">
      <h2 class="login-title">Set New Password</h2>
      <p id="reset-instructions" style="text-align: center; margin-bottom: 20px; color: var(--slate-600); font-size: 0.95rem;">
        Enter and confirm your new password below.
      </p>
      
      <div id="reset-message" class="message-area" style="min-height: 2em;"></div>

      <form id="reset-password-form">
        <!-- Hidden field to store the token -->
        <input type="hidden" id="reset-token" name="token" value="">

        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon-fa"></i>
            <input type="password" id="new-password" name="newPassword" required class="input-field" placeholder="Enter new password" autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fas fa-eye eye-icon"></i></button>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon-fa"></i>
            <input type="password" id="confirm-password" name="confirmPassword" required class="input-field" placeholder="Confirm new password" autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fas fa-eye eye-icon"></i></button>
          </div>
        </div>
        
        <button type="submit" id="submit-reset-btn" class="login-button">
          Set New Password
        </button>
      </form>
      
      <div id="back-to-login" style="text-align: center; margin-top: 24px; display: none;">
        <p style="color: #16a34a; font-weight: 600; margin-bottom: 12px;">Password successfully reset!</p>
        <a href="login.html" class="login-button" style="display: inline-block; text-decoration: none; width: auto; padding: 10px 24px;">Back to Login</a>
      </div>
    </div>
  </div>

  <!-- Load Config and Reset Script -->
  <script src="../js/config.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
