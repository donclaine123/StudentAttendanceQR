<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - EazyAttend</title>
    <!-- Link to the main login stylesheet -->
    <link rel="stylesheet" href="../css/login.css"> 
    <!-- Link to specific reset styles (keep for overrides/additions) -->
    <link rel="stylesheet" href="../css/reset-password.css">
    <!-- Include Font Awesome -->
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css"/> 
</head>
<body>
    <!-- Animated Background -->
    <div class="cyber-background">
        <div class="grid-pattern"></div>
        <div id="particles"></div>
        <div class="gradient-overlay"></div>
    </div>

    <!-- Rename outer container to match verify.html -->
    <div class="auth-container"> 
        <!-- Add Auth Header with Logo (copied from verify.html) -->
        <div class="auth-header">
            <!-- Replace img with SVG -->
            <svg class="sidebar-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
                <rect x="5" y="5" width="90" height="90" rx="25" ry="25" fill="#484b6a"/>
                <rect x="25" y="25" width="20" height="20" rx="4" ry="4" fill="white"/>
                <rect x="55" y="25" width="20" height="20" rx="4" ry="4" fill="white"/>
                <rect x="25" y="55" width="20" height="20" rx="4" ry="4" fill="white"/>
                <rect x="55" y="55" width="20" height="20" rx="4" ry="4" fill="white"/>
            </svg>
            <span class="logo-text-header">EazyAttend</span> <!-- Added Text -->
        </div>

        <!-- Existing Reset Box Content (adjust class if needed) -->
        <div class="login-box"> 
            <h2 class="login-title"><i class="fas fa-lock"></i> Set New Password</h2>
            <p id="reset-instructions" style="text-align: center; margin-bottom: 1.5rem; color: #555;">Enter and confirm your new password below.</p>
            
            <div id="reset-message" class="message-area" style="min-height: 2em;"></div> 

            <form id="reset-password-form">
                <!-- Hidden field to store the token -->
                <input type="hidden" id="reset-token" name="token" value="">

                <div class="form-group">
                    <!-- <label for="new-password">New Password</label> -->
                    <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" id="new-password" name="newPassword" required class="input-field" placeholder="Enter new password">
                         <button type="button" class="toggle-password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <!-- <label for="confirm-password">Confirm New Password</label> -->
                     <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" id="confirm-password" name="confirmPassword" required class="input-field" placeholder="Confirm new password">
                        <button type="button" class="toggle-password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                
                <button type="submit" id="submit-reset-btn" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Set New Password
                </button>
            </form>
            
            <div id="back-to-login" style="text-align: center; margin-top: 1.5rem; display: none;">
                 <p>Password successfully reset!</p>
                 <a href="login.html" class="btn btn-secondary">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Load Config and Reset Script -->
    <script src="../js/config.js"></script>
    <script src="../js/reset-password.js"></script>
    <!-- Add Floating JS for background effects -->
    <script src="../js/floating.js"></script> 
</body>
</html>
